    <script>
      // Redireciona CTAs com "Comecar jornada" / "Comece a jornada" para /jornada/.
      // Tres camadas de defesa contra o roteador TanStack do legacy:
      // 1) reescrever o href dos <a> que casam (semanticamente correto)
      // 2) attach click handler direto no elemento (capture, antes do react)
      // 3) doc-level capture handler (belt and suspenders)
      // MutationObserver cobre re-renders do SPA.
      (function () {
        // \S* (nao \w*) pra aceitar cedilha em "Comecar" — \w em JS nao
        // inclui letras acentuadas, entao "Come" + "ç" + "ar" quebrava.
        var RE = /\bcome\S*\s+(a\s+)?jornada/i;

        function matches(el) {
          return el && RE.test(((el.textContent || '') + '').trim());
        }

        function go(e) {
          if (e) {
            e.preventDefault();
            e.stopImmediatePropagation();
          }
          window.location.assign('/jornada/');
        }

        function rewire(root) {
          (root || document).querySelectorAll('a, button').forEach(function (el) {
            if (el.__jornadaWired || !matches(el)) return;
            el.__jornadaWired = true;
            if (el.tagName === 'A') {
              try { el.setAttribute('href', '/jornada/'); } catch (e) {}
            }
            el.addEventListener('click', go, true);
          });
        }

        document.addEventListener(
          'click',
          function (e) {
            var t = e.target && e.target.closest && e.target.closest('a, button');
            if (matches(t)) go(e);
          },
          true,
        );

        if (document.readyState === 'loading') {
          document.addEventListener('DOMContentLoaded', function () { rewire(); });
        } else {
          rewire();
        }
        new MutationObserver(function () { rewire(); }).observe(
          document.documentElement,
          { childList: true, subtree: true },
        );
      })();
    </script>
    <script>
      // Patches no header/CTAs do legacy (bundle pre-built sem source neste repo):
      // 1) injeta itens "Modulos", "Glossario" e "Entrar" no <ul> do header
      // 2) renomeia CTA "Explorar trilhas" para "Conhecer modulos" e leva pra /jornada/
      //    (a grid de modulos vive na propria pagina /jornada/)
      // MutationObserver cobre re-render do SPA.
      (function () {
        var MODULOS_NAV_HREF = '/jornada/#modulos';
        var GLOSSARIO_HREF = '/jornada/glossario';
        var LOGIN_HREF = '/jornada/login';
        var MODULOS_HREF = '/jornada/#modulos';
        var MODULOS_LABEL = 'Conhecer módulos';

        function injectNavItem(href, label, marker) {
          var anchor = document.querySelector('a[href="#porque"]');
          if (!anchor) return;
          var li = anchor.closest('li');
          if (!li || !li.parentNode) return;
          var ul = li.parentNode;
          if (ul.querySelector('a[' + marker + ']')) return;
          var newLi = document.createElement('li');
          var a = document.createElement('a');
          a.setAttribute('href', href);
          a.setAttribute(marker, '1');
          a.className = anchor.className;
          a.textContent = label;
          newLi.appendChild(a);
          ul.appendChild(newLi);
        }

        function rewireModulosCTA() {
          document.querySelectorAll('a').forEach(function (el) {
            if (el.__modulosWired) return;
            var txt = (el.textContent || '').trim().toLowerCase();
            // Casa o label original do bundle ou o ja renomeado (caso o no
            // tenha sido reprocessado apos rerender).
            if (txt !== 'explorar trilhas' && txt !== 'conhecer módulos') return;
            el.__modulosWired = true;
            try { el.setAttribute('href', MODULOS_HREF); } catch (e) {}
            el.textContent = MODULOS_LABEL;
            el.addEventListener('click', function (e) {
              e.preventDefault();
              e.stopImmediatePropagation();
              window.location.assign(MODULOS_HREF);
            }, true);
          });
        }

        function run() {
          injectNavItem(MODULOS_NAV_HREF, 'Módulos', 'data-modulos-link');
          injectNavItem(GLOSSARIO_HREF, 'Glossário', 'data-glossario-link');
          injectNavItem(LOGIN_HREF, 'Entrar', 'data-login-link');
          rewireModulosCTA();
        }

        if (document.readyState === 'loading') {
          document.addEventListener('DOMContentLoaded', run);
        } else {
          run();
        }
        new MutationObserver(run).observe(document.documentElement, {
          childList: true,
          subtree: true,
        });
      })();
    </script>
    <script>
      // Patch no footer da landing legacy: o bundle pre-built renderiza
      // TODOS os links do rodape como href="#". Aqui reescrevemos os que tem
      // destino existente neste repo, removemos os mortos e injetamos o link
      // "Base teorica" (que nao existe no bundle). A fonte do bundle nao esta
      // aqui, entao patch em runtime e o caminho. MutationObserver cobre re-render.
      (function () {
        // { href, external? } por chave normalizada (sem acento, lowercase).
        var FOOTER_MAP = {
          'trilhas': { href: '/jornada/modulos/trilhas' },
          'oficinas': { href: '/jornada/modulos/oficina' },
          'certificacao': { href: '/jornada/certificado.html' },
          'contato': { href: 'https://wa.me/5561998755013', external: true },
          'linkedin': { href: 'https://www.linkedin.com/in/carlacristinefigueiredo', external: true },
          'newsletter': { href: 'https://www.whatsapp.com/channel/0029Vb6DD2AAu3aXBFT6So0R', external: true, label: 'Governatech' },
        };

        // Links do footer pra remover (item nao existe).
        var FOOTER_REMOVE = ['calendario', 'instagram'];

        function normalize(s) {
          return s.normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
        }

        function rewireFooter(root) {
          (root || document).querySelectorAll('footer a').forEach(function (el) {
            if (el.__footerWired) return;
            var key = normalize((el.textContent || '').trim());
            if (FOOTER_REMOVE.indexOf(key) !== -1) {
              var li = el.closest('li');
              (li || el).remove();
              return;
            }
            var entry = FOOTER_MAP[key];
            if (!entry) return;
            el.__footerWired = true;
            try {
              el.setAttribute('href', entry.href);
              // `label` renomeia o item. Usado quando o rotulo do bundle legacy
              // descreve o formato ("Newsletter") em vez do destino, o que faria
              // o mesmo canal ter dois nomes na plataforma.
              if (entry.label) el.textContent = entry.label;
              if (entry.external) {
                el.setAttribute('target', '_blank');
                el.setAttribute('rel', 'noopener noreferrer');
              }
            } catch (e) {}
          });
        }

        // Injeta o link "Base teorica" no rodape — o bundle legacy nao tem
        // esse item. Clona o <li> de "Trilhas" pra herdar o estilo da coluna
        // e aponta pra pagina /jornada/base-teorica do app React.
        function injectFooterLink(root) {
          var doc = root || document;
          if (doc.querySelector('footer a[data-base-teorica]')) return;
          var anchor = null;
          doc.querySelectorAll('footer a').forEach(function (el) {
            if (!anchor && normalize((el.textContent || '').trim()) === 'trilhas') {
              anchor = el;
            }
          });
          if (!anchor) return;
          var li = anchor.closest('li');
          if (!li || !li.parentNode) return;
          var newLi = li.cloneNode(true);
          var a = newLi.querySelector('a');
          if (!a) return;
          a.textContent = 'Base teórica';
          a.setAttribute('href', '/jornada/base-teorica');
          a.setAttribute('data-base-teorica', '1');
          li.parentNode.appendChild(newLi);
        }

        function run() {
          rewireFooter();
          injectFooterLink();
        }

        if (document.readyState === 'loading') {
          document.addEventListener('DOMContentLoaded', run);
        } else {
          run();
        }
        new MutationObserver(run).observe(
          document.documentElement,
          { childList: true, subtree: true },
        );
      })();
    </script>
