    <script>
      // Redireciona qualquer CTA "Comecar jornada", "Comece a jornada", etc. para /jornada/
      document.addEventListener(
        'click',
        function (e) {
          var t = e.target && e.target.closest && e.target.closest('a, button');
          if (!t) return;
          var text = ((t.textContent || '') + '').trim();
          if (/\bcome\w*\s+(a\s+)?jornada/i.test(text)) {
            e.preventDefault();
            e.stopImmediatePropagation();
            window.location.assign('/jornada/');
          }
        },
        true,
      );
    </script>
