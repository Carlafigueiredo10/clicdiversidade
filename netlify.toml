[build]
  base = "."
  command = "npm install && node scripts/build.mjs"
  publish = "dist"

# `netlify dev` espelha producao numa unica porta (8888).
# - serve estaticos da raiz (index.html, assets/, lelia/) via publish = "."
# - sobe o Vite em background (porta fixa 5173) e proxia /jornada/*
# - aplica todos os [[redirects]] abaixo (SPA fallback, /lelia, /api/lelia)
# - executa as Netlify Functions de netlify/functions
[dev]
  command = "npm --prefix app run dev -- --port 5173 --strictPort"
  targetPort = 5173
  port = 8888
  framework = "#custom"
  autoLaunch = false

[build.environment]
  NODE_VERSION = "22"
  # Firebase Web SDK config (apiKey, appId, etc) sao publicos por design —
  # seguranca vem das Firestore Security Rules, nao do segredo da chave.
  # Doc: https://firebase.google.com/docs/projects/api-keys
  SECRETS_SCAN_ENABLED = "false"
  SECRETS_SCAN_SMART_DETECTION_ENABLED = "false"

# Netlify Functions — backend serverless. ANTHROPIC_API_KEY mora aqui
# (configurar em Site settings > Environment variables no painel Netlify).
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Rota da function da Lelia (path tambem declarado no proprio lelia.js).
[[redirects]]
  from = "/api/lelia"
  to = "/.netlify/functions/lelia"
  status = 200

# Rota da function do Agente de Governanca (Lelia em modo Mediacao de Risco).
[[redirects]]
  from = "/api/governanca"
  to = "/.netlify/functions/governanca"
  status = 200

# O SPA fallback do /jornada/* e gerado em build time como dist/_redirects
# (ver scripts/build.mjs). Isso evita um bug do netlify-cli no Windows
# que aplicava path.join() no rewrite e quebrava /jornada/ em dev.
#
# O legacy e multi-page estatico (index.html + lelia/index.html), nao
# precisa de SPA fallback: rotas inexistentes devem 404 normalmente.
